name: Release macOS app

'on':
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/lesslimitless-signing.keychain-db
      NOTARY_PROFILE: lesslimitless-notary
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: brew install opus pkg-config
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Configure notarization credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$API_KEY"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
      - name: Test
        run: swift test -c release
      - name: Build, sign, notarize, and package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          test -n "$IDENTITY"
          ./scripts/build-macos.sh \
            --identity "$IDENTITY" \
            --version "$VERSION" --build "$VERSION" \
            --notary-profile "$NOTARY_PROFILE" --notarize --dmg
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Less-Limitless.dmg
          generate_release_notes: true
